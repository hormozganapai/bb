<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bricks Breaker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#101827;color:white;font-family:Tahoma,sans-serif}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:clamp(5px,1.5vh,14px) 8px;overflow:hidden}
h1{color:#38bdf8;font-size:clamp(19px,4vw,28px);margin:0 0 7px}
.info{display:flex;justify-content:center;gap:clamp(10px,4vw,25px);flex-wrap:wrap;margin:4px 0 8px;font-size:clamp(12px,2.8vw,17px)}
.game-wrap{width:100%;display:flex;justify-content:center;align-items:center;flex:0 1 auto;min-height:0}
canvas{display:block;width:min(96vw,480px,calc((100svh - 175px)* 0.8));height:auto;max-height:calc(100svh - 175px);aspect-ratio:4/5;background:#1e293b;border:2px solid #38bdf8;border-radius:10px;touch-action:none}
#message{font-size:clamp(13px,3vw,18px);color:#facc15;margin:7px 0;min-height:1.4em}
.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:2px 0}
button{padding:9px 15px;border:0;border-radius:8px;background:#0ea5e9;color:white;font-size:clamp(12px,2.8vw,15px);cursor:pointer}
button:hover{background:#0284c7}
.hint{font-size:clamp(10px,2.5vw,13px);margin:5px 0 0;color:#cbd5e1}
@media(max-height:600px){
 body{padding:3px 6px}
 h1{margin-bottom:3px}
 .info{margin:2px 0 4px}
 canvas{width:min(94vw,480px,calc((100svh - 125px)* 0.8));max-height:calc(100svh - 125px)}
 #message{margin:3px 0;min-height:1.1em}
 button{padding:6px 11px}
 .hint{margin-top:2px}
}
</style>
</head>
<body>
<h1>🧱 Bricks Breaker</h1>
<div class="info">
<span>امتیاز: <b id="score">0</b></span>
<span>جان: <b id="lives">❤️❤️❤️</b></span>
<span>رکورد: <b id="record">0</b></span>
</div>
<div class="game-wrap">
<canvas id="game" width="480" height="600"></canvas>
</div>
<div id="message">برای شروع روی دکمه شروع کلیک کن!</div>
<div class="buttons">
<button onclick="startGame()">شروع بازی</button>
<button onclick="togglePause()">توقف / ادامه</button>
<button onclick="resetGame()">شروع مجدد</button>
</div>
<p class="hint">برای حرکت صفحه زیر توپ را با موس یا انگشت جابه‌جا کن.</p>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
let paddle={x:W/2-55,y:H-35,width:110,height:12};
let ball={x:W/2,y:H-60,radius:8,dx:3,dy:-4};
let bricks=[],rows=6,cols=8,brickWidth=50,brickHeight=20,gap=7;
let score=0,lives=3,record=Number(localStorage.getItem("brickRecord"))||0;
let running=false,paused=false,gameOver=false,animationId=0;
document.getElementById("record").textContent=record;
function createBricks(){
 bricks=[];const totalWidth=cols*brickWidth+(cols-1)*gap,offset=(W-totalWidth)/2;
 const colors=["#f87171","#fb923c","#facc15","#4ade80","#38bdf8","#a78bfa"];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({
 x:offset+c*(brickWidth+gap),y:65+r*(brickHeight+gap),
 width:brickWidth,height:brickHeight,alive:true,color:colors[r]});
}
function drawBall(){ctx.beginPath();ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);ctx.fillStyle="#fff";ctx.shadowBlur=15;ctx.shadowColor="#38bdf8";ctx.fill();ctx.shadowBlur=0;ctx.closePath()}
function drawPaddle(){ctx.fillStyle="#38bdf8";ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.width,paddle.height,8);ctx.fill()}
function drawBricks(){bricks.forEach(b=>{if(!b.alive)return;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.width,b.height,5);ctx.fill()})}
function draw(){ctx.clearRect(0,0,W,H);drawBricks();drawPaddle();drawBall()}
function update(){
 if(!running||paused||gameOver)return;
 ball.x+=ball.dx;ball.y+=ball.dy;
 if(ball.x+ball.radius>W||ball.x-ball.radius<0)ball.dx*=-1;
 if(ball.y-ball.radius<0)ball.dy=Math.abs(ball.dy);
 if(ball.dy>0&&ball.y+ball.radius>=paddle.y&&ball.y-ball.radius<=paddle.y+paddle.height&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.width){
  let hit=(ball.x-(paddle.x+paddle.width/2))/(paddle.width/2);
  ball.dx=hit*5;ball.dy=-Math.abs(ball.dy);
 }
 bricks.forEach(b=>{
  if(!b.alive)return;
  if(ball.x+ball.radius>b.x&&ball.x-ball.radius<b.x+b.width&&ball.y+ball.radius>b.y&&ball.y-ball.radius<b.y+b.height){
   b.alive=false;ball.dy*=-1;score+=10;
   document.getElementById("score").textContent=score;
   if(score%80===0){ball.dx*=1.06;ball.dy*=1.06}
  }
 });
 if(bricks.every(b=>!b.alive)){gameOver=true;running=false;document.getElementById("message").textContent="🏆 تبریک! همه آجرها را شکستی!"}
 if(ball.y-ball.radius>H){
  lives--;document.getElementById("lives").textContent="❤️".repeat(lives);
  if(lives<=0){gameOver=true;running=false;document.getElementById("message").textContent="😢 بازی تمام شد! امتیاز: "+score}
  else resetBall();
 }
}
function resetBall(){ball.x=W/2;ball.y=H-60;ball.dx=3;ball.dy=-4;paddle.x=W/2-paddle.width/2}
function updateRecord(){if(score>record){record=score;localStorage.setItem("brickRecord",record);document.getElementById("record").textContent=record}}
function loop(){
 if(!running||paused||gameOver)return;
 update();draw();updateRecord();
 if(!gameOver)animationId=requestAnimationFrame(loop);
}
function startGame(){
 if(running)return;
 if(gameOver)resetGame();
 paused=false;running=true;document.getElementById("message").textContent="بازی شروع شد! موفق باشی 🚀";loop();
}
function togglePause(){
 if(!running&&!paused)return;
 paused=!paused;
 if(paused)document.getElementById("message").textContent="⏸️ بازی متوقف شد";
 else{document.getElementById("message").textContent="بازی ادامه دارد!";loop()}
}
function resetGame(){
 cancelAnimationFrame(animationId);score=0;lives=3;running=false;paused=false;gameOver=false;
 document.getElementById("score").textContent=0;document.getElementById("lives").textContent="❤️❤️❤️";
 document.getElementById("message").textContent="برای شروع بازی آماده‌ای؟";
 resetBall();createBricks();draw();
}
function movePaddle(clientX){
 const rect=canvas.getBoundingClientRect(),scale=W/rect.width;
 paddle.x=(clientX-rect.left)*scale-paddle.width/2;
 paddle.x=Math.max(0,Math.min(W-paddle.width,paddle.x));
}
canvas.addEventListener("mousemove",e=>movePaddle(e.clientX));
canvas.addEventListener("touchmove",e=>{e.preventDefault();movePaddle(e.touches[0].clientX)},{passive:false});
createBricks();draw();
</script>
</body>
</html>
